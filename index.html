* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }

/* ───────── Deck (vertical slider) ───────── */
#deck { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#track { position: absolute; inset: 0; transition: transform 1s cubic-bezier(.65, 0, .35, 1); }
.slide { position: absolute; left: 0; width: 100%; height: 100%; overflow: hidden; }
.slide:nth-child(1) { top: 0; }
.slide:nth-child(2) { top: 100%; }
.slide:nth-child(3) { top: 200%; }
.slide:nth-child(4) { top: 300%; }
.slide:nth-child(5) { top: 400%; }

/* 891 × 1260 = PPT slide size. Every element below uses PPT coordinates. */
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 891px; height: 1260px;
  transform: translate(-50%, -50%) scale(var(--s));
}
/* decorative layers never catch taps — only the map buttons do */
.stage, .stage * { pointer-events: none; }
.stage .map-btn { pointer-events: auto; }

.el { position: absolute; }
.t  { position: absolute; white-space: nowrap; }
.ctr { text-align: center; }
.dot { position: absolute; width: 16.4px; height: 16.4px; border-radius: 50%; background: var(--ink); }

/* ───────── Appear / disappear effects ─────────
   Every element is hidden while its slide is inactive. When the slide
   becomes active, elements appear one after another (--d = delay);
   when it is left, they fade away again.                               */
[data-fx] {
  opacity: 0;
  transition: opacity .45s ease, translate .45s ease, scale .45s ease, filter .45s ease;
  transition-delay: 0s;
}
[data-fx="up"]    { translate: 0 40px; }
[data-fx="down"]  { translate: 0 -40px; }
[data-fx="left"]  { translate: -60px 0; }
[data-fx="zoom"]  { scale: .86; }
[data-fx="pop"]   { scale: .2; }
[data-fx="bloom"] { scale: .5; }
[data-fx="soft"]  { filter: blur(10px); scale: 1.04; }
[data-fx="word"]  { display: inline-block; translate: 0 .45em; filter: blur(6px); }
[data-fx="line"]  { translate: 0 .6em; filter: blur(4px); }

.slide.active [data-fx] {
  opacity: 1; translate: 0 0; scale: 1; filter: none;
  transition: opacity 1s ease, translate 1.1s var(--ease), scale 1.1s var(--ease), filter 1s ease;
  transition-delay: var(--d, 0s);
}
.slide.active [data-fx="pop"] {
  transition: opacity .4s ease, scale .7s var(--pop);
  transition-delay: var(--d, 0s);
}
.slide.active [data-fx="bloom"] {
  transition: opacity 1.2s ease, scale 1.5s var(--ease);
  transition-delay: var(--d, 0s);
}
.slide.active [data-fx="word"], .slide.active [data-fx="line"] {
  transition: opacity .8s ease, translate .9s var(--ease), filter .8s ease;
  transition-delay: var(--d, 0s);
}

/* pages 2–4 are informational: everything appears together,
   right after the page finishes sliding in (so the effect is visible) */
.slide.instant [data-fx], .slide.instant .roads line { --d: .75s !important; }
.slide.instant:not(.active) [data-fx="up"], .slide.instant:not(.active) [data-fx="line"], .slide.instant:not(.active) [data-fx="word"] { translate: 0 30px; }

/* flowers sway gently once they are on screen */
.sway > img { transform-origin: 50% 90%; }
.slide.active .sway > img { animation: sway 4.5s ease-in-out infinite alternate; animation-delay: var(--sd, 0s); }
@keyframes sway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }

/* map roads draw themselves */
.roads line {

  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset .4s ease;
}
.slide.active .roads line {

}

/* map app buttons */
.map-btn { position: absolute; z-index: 10; display: block; width: 75px; height: 75px; cursor: pointer; }
.map-btn > img { transition: transform .2s ease; }
.map-btn:hover > img { transform: translateY(-4px); }
.map-btn:active > img { transform: scale(.92); }
.map-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ───────── Chrome: page dots + next hint ───────── */
#dots {
  position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 10px; z-index: 5;
}
#dots button {
  width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: var(--gold); opacity: .28; transition: opacity .3s, transform .3s;
}
#dots button[aria-current="true"] { opacity: .9; transform: scale(1.3); }

#next {
  position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));

}
#next svg { width: 26px; height: 26px; animation: nudge 1.8s ease-in-out infinite; }
#next.hide { opacity: 0; pointer-events: none; }
@keyframes nudge { 0%, 100% { transform: translateY(-3px); opacity: .5; } 50% { transform: translateY(5px); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

  [data-fx], .slide.active [data-fx] { transition-duration: .01s !important; transition-delay: 0s !important; }
  .slide.active .sway > img, #next svg, .slide.active .heart > img { animation: none; }
}

  },
  tmap: {
    web: "https://tmap.life/03e5e822",
    app: () => `tmap://route?goalname=${encodeURIComponent(PLACE.name)}&goalx=${PLACE.lng}&goaly=${PLACE.lat}`,
    pkg: "com.skt.tmap.ku",
  },
};

/* ───────── 자동 최신화 ─────────
   휴대폰·카카오톡이 예전 화면을 저장해 두고 보여주는 경우를 막기 위해,
   열릴 때 서버의 최신 버전을 확인하고 더 새 버전이 있으면 그걸로 다시 불러와요.
   (업데이트할 때 위쪽 <!-- version: vN --> 주석만 올리면 자동으로 동작) */
(() => {
  // the <!-- version: vN --> comment sits right inside <html>, so it is part of its innerHTML
  const current = (document.documentElement.innerHTML.match(/version: (v\d+)/) || [])[1];
  if (!current || location.protocol === "file:") return;
  fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })
    .then((r) => r.ok ? r.text() : "")
    .then((txt) => {
      const latest = (txt.match(/version: (v\d+)/) || [])[1];
      if (!latest || latest === current) return;
      const url = new URL(location.href);
      if (url.searchParams.get("v") === latest) return;      // already tried once — avoid loops
      url.searchParams.set("v", latest);
      location.replace(url.toString());
    })
    .catch(() => {});
})();

(() => {
  const STAGE_W = 891, STAGE_H = 1260;
  const root = document.documentElement;
  const track = document.getElementById("track");
  const slides = [...document.querySelectorAll(".slide")];
  const dotsNav = document.getElementById("dots");
  const nextBtn = document.getElementById("next");
  let index = 0, animating = false;

  /* fit the PPT-sized stage into the viewport */
  function fit() {
    const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
    root.style.setProperty("--s", s.toFixed(4));
  }
  fit();
  addEventListener("resize", fit);

  /* data-split="start step": reveal text word by word */
  document.querySelectorAll("[data-split]").forEach((el) => {
    const [start, step] = el.dataset.split.split(" ").map(Number);
    let i = 0;
    [...el.childNodes].forEach((node) => {
      if (node.nodeType !== 3) return;
      const frag = document.createDocumentFragment();
      node.textContent.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const w = document.createElement("span");
        w.dataset.fx = "word";
        w.style.setProperty("--d", (start + step * i++).toFixed(2) + "s");
        w.textContent = part;
        frag.appendChild(w);
      });
      node.replaceWith(frag);
    });
  });

  /* data-stagger="start step": reveal child lines one after another */
  document.querySelectorAll("[data-stagger]").forEach((el) => {
    const [start, step] = el.dataset.stagger.split(" ").map(Number);
    [...el.children].forEach((c, i) => {
      c.dataset.fx = "line";
      c.style.setProperty("--d", (start + step * i).toFixed(2) + "s");
    });
  });

  /* page dots */
  const dots = slides.map((s, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `${i + 1}번째 페이지: ${s.getAttribute("aria-label")}`);
    b.addEventListener("click", () => go(i));
    dotsNav.appendChild(b);
    return b;
  });

  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === index && slides[i].classList.contains("active")) return;
    const prev = slides[index];
    index = i;
    animating = true;
    track.style.transform = `translateY(${-100 * i}%)`;
    prev.classList.remove("active");           // old slide's elements fade away
    slides[i].classList.add("active");         // new slide's elements appear in sequence
    dots.forEach((d, k) => d.setAttribute("aria-current", k === i));
    nextBtn.classList.toggle("hide", i === slides.length - 1);
    setTimeout(() => (animating = false), 950);
  }
  const next = () => go(index + 1);
  const prev = () => go(index - 1);
  nextBtn.addEventListener("click", next);

  /* wheel / trackpad: one slide per gesture */
  let lastWheel = 0;
  addEventListener("wheel", (e) => {
    e.preventDefault();
    const now = Date.now(), gap = now - lastWheel;
    lastWheel = now;
    if (animating || gap < 180 || Math.abs(e.deltaY) < 4) return;
    e.deltaY > 0 ? next() : prev();
  }, { passive: false });

  /* touch swipe */
  let sx = 0, sy = 0, tracking = false;
  addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dy) < 40 || Math.abs(dy) < Math.abs(dx) || animating) return;
    dy < 0 ? next() : prev();
  });

  /* keyboard */
  addEventListener("keydown", (e) => {
    if (["ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
  });

  /* start once fonts are ready so the first animation isn't wasted (#3 → open page 3) */
  const start = () => requestAnimationFrame(() => go((parseInt(location.hash.slice(1), 10) || 1) - 1));
  (document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start);

  /* ───────── map links ─────────
     PC            : the <a href> opens the web page in a new tab (default link behaviour)
     Mobile browser: open the app directly; if it isn't installed, go to the web page
     In-app browser (KakaoTalk etc.): navigating the invitation page itself to an app
                     link makes KakaoTalk close its browser and return to the chat.
                     So the app link is fired from a hidden inner frame instead — the
                     invitation page never leaves. If no app opens, the web map is
                     opened in a new window on top of the invitation.               */
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|BAND\//i.test(ua);

  function appLink(m, withFallback) {
    const appUrl = m.app();
    if (!isAndroid) return appUrl;
    const [scheme, rest] = appUrl.split("://");
    return `intent://${rest}#Intent;scheme=${scheme};action=android.intent.action.VIEW;`
      + `category=android.intent.category.BROWSABLE;package=${m.pkg};`
      + (withFallback ? `S.browser_fallback_url=${encodeURIComponent(m.web)};` : "")
      + "end";
  }

  function fireInFrame(url) {
    const f = document.createElement("iframe");
    f.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden";
    f.src = url;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 3000);
  }

  function openApp(m) {
    let left = false;
    const markLeft = () => { left = true; };
    const onVis = () => { if (document.hidden) markLeft(); };
    document.addEventListener("visibilitychange", onVis);
    addEventListener("pagehide", markLeft, { once: true });
    addEventListener("blur", markLeft, { once: true });

    // no app opened → web map (in-app browsers: new window, so the invitation stays)
    setTimeout(() => {
      document.removeEventListener("visibilitychange", onVis);
      if (left || document.hidden) return;
      if (inApp) { if (!window.open(m.web, "_blank")) location.href = m.web; }
      else location.href = m.web;
    }, 2200);

    if (inApp) fireInFrame(appLink(m, false));
    else location.href = appLink(m, true);
  }

  document.querySelectorAll(".map-btn").forEach((a) => {
    a.addEventListener("click", (e) => {
      if (!isAndroid && !isIOS) return;          // PC → normal link to the web page
      e.preventDefault();
      openApp(MAPS[a.dataset.map]);
    });
  });
})();
</script>
</body>
</html>
